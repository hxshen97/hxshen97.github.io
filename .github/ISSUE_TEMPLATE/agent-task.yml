name: 自动开发需求
description: 记录需求，再在 Codex 聊天引用此 Issue；不会触发云端模型开发。
title: "[需求] "
body:
  - type: textarea
    id: request
    attributes:
      label: 原始需求
      description: 描述想解决的问题或期望效果，无需给出实现方案。创建后在 Codex 聊天中交给代理执行。
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 补充约束（可选）
      description: 例如视觉参考、必须保留的内容、期望验收结果。
